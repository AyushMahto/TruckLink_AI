name: trucklink_ai
description: "AI Powered Truck Logistics Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.5.0
  dio: ^5.9.0

  # Routing
  go_router: ^16.3.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Maps & Location
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  flutter_polyline_points: ^2.1.0

  # Local Storage
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.1
  lottie: ^3.3.2

  # Utilities
  intl: ^0.20.2
  fluttertoast: ^8.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/